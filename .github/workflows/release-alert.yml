name: Alert on blocked or failed releases

on:
  workflow_run:
    workflows: ["Test", "Auto Release on CLI Bump", "Publish to PyPI"]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    if: |
      contains(fromJSON('["failure", "timed_out", "cancelled"]'), github.event.workflow_run.conclusion) && (
        github.event.workflow_run.name != 'Test' || (
          github.event.workflow_run.event == 'push' &&
          startsWith(github.event.workflow_run.head_commit.message, 'chore: bump bundled CLI version to')
        )
      )
    steps:
      - name: Build Slack payload
        id: build
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          SLACK_CHANNEL: C09HY5E0K60
        run: |
          set -euo pipefail
          echo "LISTENER_FIRED name=$WORKFLOW_NAME conclusion=$CONCLUSION"
          echo "RUN_EVENT=${{ github.event.workflow_run.event }}"
          echo "HEAD_BRANCH=${{ github.event.workflow_run.head_branch }}"
          echo "HEAD_REPO=${{ github.event.workflow_run.head_repository.full_name }}"
          echo "COMMIT_MESSAGE_BEGIN"
          printf '%s\n' "$COMMIT_MESSAGE"
          echo "COMMIT_MESSAGE_END"
          ESC='def esc:
                 gsub("&";"&amp;")
                 | gsub("<";"&lt;")
                 | gsub(">";"&gt;")
                 | gsub("[[:cntrl:]]";" ");'
          probe=$(jq -rn "$ESC"' "<&>" | esc')
          if [ "$probe" != '&lt;&amp;&gt;' ]; then
            echo "::error::mrkdwn escape self-test failed (got '$probe'); refusing to post"
            exit 1
          fi
          if [ "$WORKFLOW_NAME" = "Test" ]; then
            HEADLINE="Release blocked: Test ended $CONCLUSION on a CLI bump, so Auto Release skipped it"
          else
            HEADLINE="Release failed: $WORKFLOW_NAME ended $CONCLUSION"
          fi
          export HEADLINE
          payload=$(jq -nc "$ESC"'
            {
              channel: env.SLACK_CHANNEL,
              text: (env.HEADLINE + " (" + env.GITHUB_REPOSITORY + ")"),
              blocks: [
                {type:"section", text:{type:"mrkdwn",
                  text:(":rotating_light: *" + (env.HEADLINE|esc) + "* in " + env.GITHUB_REPOSITORY)}},
                {type:"section", text:{type:"mrkdwn",
                  text:("*Commit:* "
                        + ((env.COMMIT_MESSAGE // "") | split("\n")[0] // ""
                           | if . == "" then "(no commit message)" else esc end)
                        + " (" + env.HEAD_SHA[0:7] + ")\n<" + env.RUN_URL + "|View run>")}}
              ]
            }')
          printf 'payload=%s\n' "$payload" >> "$GITHUB_OUTPUT"
          echo "PAYLOAD_BEGIN"
          printf '%s\n' "$payload"
          echo "PAYLOAD_END"

      - name: Prove the Slack credential is present in this privileged run
        env:
          TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then echo "SECRET_AVAILABLE=no"; exit 1; fi
          echo "SECRET_AVAILABLE=yes length=${#TOKEN} sha256=$(printf '%s' "$TOKEN" | sha256sum | cut -c1-16)"
          echo "PAYLOAD_LENGTH=$(printf '%s' "${{ steps.build.outputs.payload }}" | wc -c)"
